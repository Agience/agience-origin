<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify email · Agience</title><link rel="icon" href="/web/favicon.png"><link rel="stylesheet" href="/web/app.css">
</head><body>
<div class="bg"><div class="grad"></div><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <img class="logo" src="/web/logo_v.png" alt="Agience">
  <h1>Email verification</h1>
  <div class="msg muted" id="msg">Verifying…</div>
  <a class="primary hidden" id="continue" href="/account">Continue to Agience</a>

  <form id="confirm" class="hidden">
    <label for="cpassword">Password</label>
    <input id="cpassword" type="password" autocomplete="current-password" required>
    <button class="primary" type="submit" id="confirmBtn">Confirm my email</button>
    <div class="row"><button class="link" type="button" id="disownBtn">I didn't create this account</button></div>
  </form>

  <div id="resend" class="hidden">
    <p class="muted" style="text-align:center">Enter your email to get a new verification link.</p>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">
    <button class="primary" type="button" id="resendBtn">Send verification link</button>
  </div>

  <div class="foot"><a class="signin" href="/">Back to sign in</a></div>
</div>

<script src="/web/bg.js"></script>
<script src="/web/app.js"></script>
<script src="/web/verify-email-page.js"></script>
</body></html>
