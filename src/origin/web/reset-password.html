<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password · Agience</title><link rel="icon" href="/web/favicon.png"><link rel="stylesheet" href="/web/app.css">
</head><body>
<div class="bg"><div class="grad"></div><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <img class="logo" src="/web/logo_v.png" alt="Agience">

  <!-- REQUEST (no token): enter email -->
  <div id="request">
    <h1>Reset your password</h1>
    <form id="reqForm">
      <p class="muted" style="text-align:center">Enter your email and we'll send you a reset link.</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      <button class="primary" type="submit" id="reqBtn">Send reset link</button>
    </form>
    <div id="reqSent" class="hidden ok msg">If an account exists for that email, a reset link is on its way. Check your inbox.</div>
  </div>

  <!-- CONFIRM (token present): set new password -->
  <div id="confirm" class="hidden">
    <h1>Choose a new password</h1>
    <form id="confForm" method="post" action="#">
      <!-- The account the new password belongs to: what a password manager saves it under. -->
      <label for="user" id="userLabel" class="hidden">Account</label>
      <input id="user" name="username" type="email" autocomplete="username" readonly aria-readonly="true" tabindex="-1" class="hidden" style="background:transparent;border-color:transparent;color:inherit;cursor:default;">
      <label for="np">New password</label>
      <input id="np" name="new-password" type="password" autocomplete="new-password" required placeholder="At least 12 characters">
      <label for="np2">Confirm password</label>
      <input id="np2" name="confirm-password" type="password" autocomplete="new-password" required>
      <button class="primary" type="submit" id="confBtn">Update password</button>
    </form>
  </div>

  <div class="msg" id="msg"></div>
  <div class="foot"><a href="/">Back to sign in</a></div>
</div>

<script src="/web/bg.js"></script>
<script src="/web/app.js"></script>
<script>
const $ = (s)=>document.querySelector(s), msg=$("#msg");
const token = qs("token");
function show(t,cls){ msg.className="msg "+(cls||"muted"); msg.textContent=t||""; }

if (token) { $("#request").classList.add("hidden"); $("#confirm").classList.remove("hidden"); }
// The account comes from the token (server-side), never from the URL: a link cannot be made to
// name one account while resetting another.
if (token) {
  post("/auth/password/reset-check", { token }).then((r) => {
    if (r.ok && r.data && r.data.email) {
      $("#user").value = r.data.email;
      $("#user").classList.remove("hidden"); $("#userLabel").classList.remove("hidden");
    } else {
      $("#confirm").classList.add("hidden");
      show("This reset link is invalid or has expired. Request a new one.", "err");
    }
  });
}

// request a reset link
$("#reqForm") && $("#reqForm").addEventListener("submit", async (e)=>{
  e.preventDefault(); const b=$("#reqBtn"); b.disabled=true; show("Sending…");
  await post("/auth/password/reset-request", { email: $("#email").value.trim().toLowerCase() });
  // same UX whether or not the account exists
  $("#reqForm").classList.add("hidden"); $("#reqSent").classList.remove("hidden"); show("");
});

// confirm new password
$("#confForm") && $("#confForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  if ($("#np").value !== $("#np2").value) { show("Passwords do not match.","err"); return; }
  if ($("#np").value.length < 12) { show("Password must be at least 12 characters.","err"); return; }
  const b=$("#confBtn"); b.disabled=true; show("Updating…");
  const r = await post("/auth/password/reset-confirm", { token, new_password: $("#np").value });
  if (r.ok) { $("#confirm").classList.add("hidden"); show("Password updated ✓ — redirecting to sign in…","ok"); setTimeout(()=>location.href="/",1400); return; }
  show(r.detail || "This reset link is invalid or has expired. Request a new one.","err"); b.disabled=false;
});
</script>
</body></html>
