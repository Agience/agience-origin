<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passkeys · Agience</title><link rel="icon" href="/web/favicon.png"><link rel="stylesheet" href="/web/app.css">
</head><body>
<div class="bg"><div class="grad"></div><div class="blob b1"></div><div class="blob b2"></div></div>
<div class="card">
  <img class="logo" src="/web/logo_v.png" alt="Agience">
  <h1>Passkeys</h1>
  <p class="muted">Every passkey ceremony happens on this page, at Origin's own address.</p>

  <div id="signin">
    <input id="email" type="email" autocomplete="username webauthn" placeholder="Email">
    <button class="primary" id="signinBtn" type="button">Sign in with a passkey</button>
  </div>

  <div id="manage" class="hidden">
    <input id="device" type="text" placeholder="Name this device (optional)">
    <button class="primary" id="addBtn" type="button">Add a passkey</button>
    <div id="list"></div>
    <button class="link" id="linkBtn" type="button">Link a sign-in method</button>
    <div id="linkConfirm" class="hidden">
      <p id="linkWhat">A sign-in came back to be linked to your account.</p>
      <button class="primary" id="linkYes" type="button">Link it</button>
      <button class="link" id="linkNo" type="button">Cancel</button>
    </div>
    <h2>Background jobs</h2>
    <p class="muted">Jobs you let open your content while you are away. Revoke any you no longer want.</p>
    <div id="jobs"></div>
  </div>

  <div class="row"><button class="link" id="consoleBtn" type="button">Operator console sign-in</button></div>
  <div class="msg" id="msg"></div>
</div>
<script src="/web/bg.js"></script>
<script src="/web/app.js"></script>
<script src="/web/passkey.js"></script>
<script src="/web/passkey-page.js"></script>
</body></html>
